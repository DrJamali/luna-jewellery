name: Deploy to GitHub Pages

# Auto-deploy on push is DISABLED. The live store now runs on the DO server
# (Node + SQLite backend + admin dashboard). GitHub Pages is static and can't
# run that backend, so a Pages build would have a non-working checkout/admin.
# This workflow can still be triggered manually if a static showcase is wanted.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
