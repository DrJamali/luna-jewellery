<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Bag · LUNA</title>
  <meta name="description" content="Your Luna shopping bag. Review your pieces and check out with cash on delivery across Pakistan." />
  <meta name="theme-color" content="#f6f6f4" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="mask-icon" href="/favicon.svg" color="#e6cb8d" />
  <link rel="apple-touch-icon" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body data-page="cart">

  <div class="preloader" id="preloader">
    <div class="preloader__inner">
      <div class="preloader__moon"><svg viewBox="0 0 100 100" aria-hidden="true"><path d="M68 18 A38 38 0 1 0 68 82 A30 30 0 1 1 68 18 Z" /><path d="M72 24 l1.5 4 4 1.5 -4 1.5 -1.5 4 -1.5 -4 -4 -1.5 4 -1.5 Z" stroke-width="1.2" /></svg></div>
      <div class="preloader__word">LUNA</div>
      <div class="preloader__bar"><span id="pl-bar"></span></div>
    </div>
  </div>

  <div id="nav-mount"></div>

  <main class="page">
    <div class="wrap">
      <div class="page__head reveal">
        <p class="page__crumb"><a href="index.html">Home</a> &nbsp;/&nbsp; Your bag</p>
        <h1>Your <span class="g">bag</span></h1>
      </div>

      <div class="cart" id="cart-root">
        <div class="cart__lines" id="cart-lines"></div>

        <aside class="summary" id="cart-summary">
          <h2>Summary</h2>
          <div class="summary__row"><span>Subtotal</span><span id="sum-subtotal">Rs 0</span></div>
          <div class="summary__row"><span>Delivery</span><span id="sum-shipping">—</span></div>
          <div class="summary__row summary__row--total"><span>Total</span><span id="sum-total">Rs 0</span></div>
          <a href="checkout.html" class="btn btn--solid summary__cta" id="cart-checkout" data-magnetic>
            <span>Checkout</span>
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </a>
          <a href="shop.html" class="summary__link">Continue shopping</a>
          <p class="summary__note">Cash on delivery across Pakistan. Free delivery over Rs 15,000.</p>
        </aside>
      </div>

      <div class="empty" id="cart-empty" hidden>
        <div class="empty__moon"><svg viewBox="0 0 100 100" aria-hidden="true"><path d="M68 18 A38 38 0 1 0 68 82 A30 30 0 1 1 68 18 Z" /></svg></div>
        <h2>Your bag is empty</h2>
        <p>Nothing here yet. Let the moon pick something for you.</p>
        <a href="shop.html" class="btn btn--solid" data-magnetic><span>Browse the collection</span></a>
      </div>
    </div>
  </main>

  <div id="footer-mount"></div>

  <script type="module" src="/src/store.js"></script>
</body>
</html>
